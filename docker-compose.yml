services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smm_panel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-smm_panel}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - smm_panel_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smm_panel} -d ${POSTGRES_DB:-smm_panel}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  smm_panel_pgdata:
